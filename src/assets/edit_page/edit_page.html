<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Ninja</title>
    <link rel="stylesheet" href="edit_page.css">
</head>
<body>
<div class="h1">Edit a Ninja</div>
<div class="body-container">
    <div class="container container_left">
        <div class="character-card character-card_colour">
            <div class="character-card__photo">
                <img
                        class="character-card__img"
                        src=""
                >
            </div>
            <div class="character-card__name"></div>

            <div class="character-card__field character-card__field_property">Health</div>
            <div class="character-card__field character-card__field_value"></div>

            <div class="character-card__field character-card__field_property">Chakra</div>
            <div class="character-card__field character-card__field_value"></div>

            <div class="character-card__field character-card__field_property">Ninja rank</div>
            <div class="character-card__field character-card__field_value"></div>

            <div class="character-card__field character-card__field_property">Organization</div>
            <div class="character-card__field character-card__field_value"></div>

            <div class="character-card__field character-card__field_property">Village</div>
            <div class="character-card__field character-card__field_value"></div>
        </div>
    </div>
    <div class="container container_right">
        <label for="classSelector">Select Ninja Type:</label>
        <select id="classSelector">
            <option value="AbstractNinja">AbstractNinja</option>
        </select>

        <div id="formContainer">
            <form class="form-grid">

            </form>
        </div>
    </div>
</div>

<script src="edit_page.js" type="module"></script>
</body>
</html>
